spring:
    datasource:
        url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5433}/${POSTGRES_DB:freelance_db}
        username: ${POSTGRES_USER:postgres}
        password: ${POSTGRES_PASSWORD:123456}
        driver-class-name: org.postgresql.Driver

    jpa:
        hibernate:
            ddl-auto: validate
        show-sql: true
        properties:
            hibernate:
                format_sql: true

logging:
    level:
        org.hibernate.SQL: DEBUG
