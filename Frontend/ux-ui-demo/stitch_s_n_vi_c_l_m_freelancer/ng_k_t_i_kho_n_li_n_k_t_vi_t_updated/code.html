<body class="bg-surface text-on-surface font-body-md min-h-screen flex flex-col antialiased">
<!-- TopNavBar Suppressed: Transactional Screen (Registration) -->
<main class="flex-grow flex items-center justify-center p-gutter md:py-xl">
<div class="w-full max-w-5xl bg-surface-container-lowest rounded-2xl shadow-xl overflow-hidden flex flex-col md:flex-row">
<!-- Left Side: Branding / Visual (Hidden on mobile) -->
<div class="hidden md:block md:w-1/2 relative bg-surface-variant">
<img alt="Professional collaboration" class="absolute inset-0 w-full h-full object-cover" src="https://lh3.googleusercontent.com/aida-public/AB6AXuAy7ouHfKo02Ut14KiTCy4Gdxu2sZvlg3fCINLlTWocZJhYjd6pyORWbzZuIbAerbxY9841gTsu1qbrqFzQlm9kqGbdtuv285hPnoH9ppmcktRHg9LpRYJmPvDXZOuK9f-8ZtpvmQEqGHC7OAQ6Y9hFxuYwutWzGcIVJbM6gmo4cou1iBSiHGd_pOZ2D-mkb4RpPdszROz8ifXIY2AYVjpV46y1w4BOm2zLC5oYjfBfY2CXZbhrwZUQKw">
<div class="absolute inset-0 bg-gradient-to-t from-primary/80 to-transparent"></div>
<div class="absolute bottom-0 left-0 p-xl">
<h1 class="font-headline-lg text-headline-lg text-white mb-sm">Liên Kết Việt</h1>
<p class="font-body-lg text-body-lg text-white/90">Hệ thống kết nối Freelancer minh bạch &amp; tin cậy tại Việt Nam.</p>
</div>
</div>
<!-- Right Side: Registration Form -->
<div class="w-full md:w-1/2 p-lg md:p-xl flex flex-col justify-center bg-surface-container-lowest">
<div class="mb-lg">
<h2 class="font-headline-md text-headline-md text-trust-blue mb-xs md:hidden">Liên Kết Việt</h2>
<h3 class="font-headline-md text-headline-md text-on-surface">Đăng ký tài khoản mới</h3>
<p class="font-body-md text-body-md text-on-surface-variant mt-sm">Tại Liên Kết Việt, bạn có thể vừa đăng dự án vừa ứng tuyển công việc với cùng một tài khoản.</p>
</div>
<form action="#" class="space-y-md" method="POST">
<!-- Role Selection -->
<!-- Personal Info -->
<div class="space-y-sm">
<div>
<label class="block font-label-md text-label-md text-on-surface mb-xs" for="fullname">Họ và tên</label>
<input class="w-full bg-surface border border-outline-variant rounded-lg px-sm py-[12px] font-body-md text-body-md text-on-surface focus:outline-none focus:ring-2 focus:ring-trust-blue/20 focus:border-trust-blue transition-shadow placeholder:text-outline" id="fullname" name="fullname" placeholder="Nguyễn Văn A" required="" type="text">
</div>
<div>
<label class="block font-label-md text-label-md text-on-surface mb-xs" for="email">Email</label>
<input class="w-full bg-surface border border-outline-variant rounded-lg px-sm py-[12px] font-body-md text-body-md text-on-surface focus:outline-none focus:ring-2 focus:ring-trust-blue/20 focus:border-trust-blue transition-shadow placeholder:text-outline" id="email" name="email" placeholder="nguyenvana@example.com" required="" type="email">
</div>
<div>
<label class="block font-label-md text-label-md text-on-surface mb-xs" for="password">Mật khẩu</label>
<div class="relative">
<input class="w-full bg-surface border border-outline-variant rounded-lg pl-sm pr-10 py-[12px] font-body-md text-body-md text-on-surface focus:outline-none focus:ring-2 focus:ring-trust-blue/20 focus:border-trust-blue transition-shadow placeholder:text-outline" id="password" name="password" placeholder="••••••••" required="" type="password">
<button class="absolute right-sm top-1/2 -translate-y-1/2 text-outline hover:text-on-surface transition-colors" type="button">
<span class="material-symbols-outlined text-[20px]">visibility_off</span>
</button>
</div>
</div>
<div>
<label class="block font-label-md text-label-md text-on-surface mb-xs" for="confirm_password">Xác nhận mật khẩu</label>
<input class="w-full bg-surface border border-outline-variant rounded-lg px-sm py-[12px] font-body-md text-body-md text-on-surface focus:outline-none focus:ring-2 focus:ring-trust-blue/20 focus:border-trust-blue transition-shadow placeholder:text-outline" id="confirm_password" name="confirm_password" placeholder="••••••••" required="" type="password">
</div>
</div>
<!-- Terms -->
<div class="flex items-start gap-sm pt-xs">
<div class="flex items-center h-5">
<input class="h-4 w-4 rounded border-outline-variant text-trust-blue focus:ring-trust-blue transition-colors" id="terms" name="terms" required="" type="checkbox">
</div>
<div class="text-sm leading-5">
<label class="font-body-sm text-body-sm text-on-surface-variant" for="terms">
                                Tôi đồng ý với <a class="font-label-md text-trust-blue hover:text-primary-container hover:underline transition-colors" href="#">Điều khoản sử dụng</a> và <a class="font-label-md text-trust-blue hover:text-primary-container hover:underline transition-colors" href="#">Chính sách bảo mật</a> của Liên Kết Việt.
                            </label>
</div>
</div>
<!-- Submit Action -->
<div class="pt-sm">
<button class="w-full bg-trust-blue hover:bg-primary-container text-white font-label-md text-label-md py-[12px] rounded-lg shadow-sm transition-all duration-200 flex justify-center items-center gap-xs" type="submit">
                            Tạo tài khoản
                        </button>
</div>
</form>
<div class="mt-lg text-center">
<p class="font-body-sm text-body-sm text-on-surface-variant">
                        Đã có tài khoản? <a class="font-label-md text-trust-blue hover:text-primary-container hover:underline transition-colors" href="#">Đăng nhập ngay</a>
</p>
</div>
</div>
</div>
