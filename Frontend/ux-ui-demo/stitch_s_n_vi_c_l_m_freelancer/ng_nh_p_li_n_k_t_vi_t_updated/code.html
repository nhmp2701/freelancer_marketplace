<body class="bg-surface min-h-screen flex items-center justify-center p-md text-on-surface">
<div class="w-full max-w-container-max mx-auto bg-surface-container-lowest rounded-xl shadow-[0_8px_30px_rgb(0,0,0,0.08)] overflow-hidden flex flex-col md:flex-row h-full md:h-[700px] border border-surface-variant/30">

<div class="absolute inset-0 bg-gradient-to-t from-black/70 via-black/20 to-transparent z-10"></div>

<div class="absolute bottom-0 left-0 right-0 z-20 flex flex-col justify-end items-start p-xl text-white">
<h1 class="font-headline-xl text-headline-xl mb-sm leading-tight text-white drop-shadow-md">Kết Nối. <br>Xây Dựng. <br>Thành Công.</h1>
<p class="font-body-lg text-body-lg text-surface-bright opacity-95 max-w-md drop-shadow-md">Tham gia mạng lưới chuyên gia hàng đầu và doanh nghiệp uy tín tại Việt Nam.</p>
</div>
</div>
<!-- Right Side: Login Form -->
<div class="w-full md:w-1/2 p-lg md:p-xl flex flex-col justify-center h-full bg-surface-container-lowest relative">
<div class="mb-lg">
<div class="flex items-center gap-2 mb-md">
<span class="material-symbols-outlined text-trust-blue text-[32px]" data-icon="hub">hub</span>
<span class="font-headline-md text-headline-md text-trust-blue font-bold tracking-tight">Liên Kết Việt</span>
</div>
<h2 class="font-headline-lg text-headline-lg text-on-surface mb-xs font-bold">Đăng nhập</h2>
<p class="font-body-md text-body-md text-on-surface-variant">Chào mừng bạn quay lại nền tảng.</p>
</div>
<form class="space-y-md">
<!-- Email Field -->
<div>
<label class="block font-label-md text-label-md text-on-surface mb-xs" for="email">Email</label>
<div class="relative">
<span class="absolute inset-y-0 left-0 flex items-center pl-sm text-outline pointer-events-none">
<span class="material-symbols-outlined text-[20px]" data-icon="mail">mail</span>
</span>
<input class="w-full pl-lg pr-sm py-[10px] rounded-lg border border-outline-variant bg-surface-container-lowest font-body-md text-body-md text-on-surface focus:ring-2 focus:ring-trust-blue/20 focus:border-trust-blue transition-all outline-none" id="email" name="email" placeholder="nhapemail@vidu.com" required="" type="email">
</div>
</div>
<!-- Password Field -->
<div>
<label class="block font-label-md text-label-md text-on-surface mb-xs" for="password">Mật khẩu</label>
<div class="relative">
<span class="absolute inset-y-0 left-0 flex items-center pl-sm text-outline pointer-events-none">
<span class="material-symbols-outlined text-[20px]" data-icon="lock">lock</span>
</span>
<input class="w-full pl-lg pr-sm py-[10px] rounded-lg border border-outline-variant bg-surface-container-lowest font-body-md text-body-md text-on-surface focus:ring-2 focus:ring-trust-blue/20 focus:border-trust-blue transition-all outline-none" id="password" name="password" placeholder="••••••••" required="" type="password">
<button class="absolute inset-y-0 right-0 flex items-center pr-sm text-outline hover:text-trust-blue transition-colors" type="button">
<span class="material-symbols-outlined text-[20px]" data-icon="visibility_off">visibility_off</span>
</button>
</div>
</div>
<!-- Options -->
<div class="flex items-center justify-between mt-sm">
<div class="flex items-center">
<input class="h-4 w-4 rounded border-outline-variant text-trust-blue focus:ring-trust-blue cursor-pointer" id="remember-me" name="remember-me" type="checkbox">
<label class="ml-2 block font-body-sm text-body-sm text-on-surface-variant cursor-pointer" for="remember-me">
                            Ghi nhớ tôi
                        </label>
</div>
<a class="font-label-md text-label-md text-trust-blue hover:text-action-orange transition-colors" href="#">Quên mật khẩu?</a>
</div>
<!-- Submit Button -->
<button class="w-full bg-trust-blue hover:bg-primary text-white font-label-md text-label-md py-[12px] rounded-lg transition-colors flex justify-center items-center gap-2 shadow-sm mt-4" type="submit">
                    Đăng nhập
                    <span class="material-symbols-outlined text-[20px]" data-icon="arrow_forward">arrow_forward</span>
</button>
</form>
<!-- Divider -->
<div class="mt-lg mb-lg relative">
<div aria-hidden="true" class="absolute inset-0 flex items-center">
<div class="w-full border-t border-surface-variant"></div>
</div>
<div class="relative flex justify-center text-sm">
<span class="bg-surface-container-lowest px-4 font-body-sm text-body-sm text-outline">Hoặc tiếp tục với</span>
</div>
</div>
<!-- Social Login -->

                Chưa có tài khoản?

</p>
