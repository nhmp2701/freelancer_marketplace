spring:
    datasource:
        url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5433}/${POSTGRES_DB:freelance_db}
        username: ${POSTGRES_USER:postgres}
        password: ${POSTGRES_PASSWORD}
        driver-class-name: org.postgresql.Driver

    jpa:
        hibernate:
            ddl-auto: validate
        open-in-view: false
        show-sql: false
        properties:
            hibernate:
                format_sql: true

    flyway:
        baseline-on-migrate: true
        baseline-version: 0

jwt:
    secret: ${JWT_SECRET:}
    expiration: ${JWT_EXPIRATION_MS:86400000}

app:
    cors:
        allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
